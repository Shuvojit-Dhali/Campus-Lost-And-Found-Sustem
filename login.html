<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <a href="index.html" class="home-link">← CampusFind</a>
    <a href="signup.html" class="signup-btn">Sign Up</a>

    <div class="login-form-wrapper">
      <div class="form-card">
        <div class="form-title">Welcome Back</div>
        <div class="form-subtitle">Login with your Student ID 👋</div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
          <label class="form-label" for="login-id">Student ID</label>
          <input
            class="form-input"
            id="login-id"
            type="text"
            placeholder="e.g. 2024001"
            autocomplete="username"
            required
          />

          <label class="form-label" for="login-password">Password</label>
          <div class="password-wrapper">
            <input
              class="form-input"
              id="login-password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <span class="eye-icon" onclick="togglePassword('login-password', this)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 6C8.5 6 5.5 7.8 3.5 10.5C3.1 11.1 3.1 11.9 3.5 12.5C5.5 15.2 8.5 17 12 17C15.5 17 18.5 15.2 20.5 12.5C20.9 11.9 20.9 11.1 20.5 10.5C18.5 7.8 15.5 6 12 6Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
                <path class="eye-slash" d="M4 4L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
          </div>

          <div class="form-options">
            <label class="remember-wrapper">
              <input type="checkbox" id="remember" />
              <span class="checkbox-square"></span>
              <span class="remember-me">Remember Me</span>
            </label>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-prompt">
          Don't have an account?
          <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </div>
  </div>

  <script>
  function togglePassword(id, icon) {
    const input = document.getElementById(id);
    const slash = icon.querySelector('.eye-slash');
    if (input.type === 'password') {
      input.type = 'text';
      slash.style.display = 'none';
    } else {
      input.type = 'password';
      slash.style.display = 'block';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const id = document.getElementById('login-id').value.trim();
    const pass = document.getElementById('login-password').value.trim();
    const err = document.getElementById('errorMsg');

    if (!id || !pass) {
      err.textContent = 'Please fill in both fields.';
      err.style.display = 'block';
      return;
    }

    // --- NEW CODE: Talk to the Backend! ---
    try {
      const response = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ studentId: id, password: pass })
      });

      const data = await response.json();

      if (response.ok) {
        // Save the token and user info
        localStorage.setItem('token', data.token);
        localStorage.setItem('studentId', data.studentId);
        
        err.style.display = 'none';
        alert('Login successful!');
        window.location.href = 'index.html'; // Redirect to home/dashboard
      } else {
        err.textContent = data.message || 'Invalid Student ID or password.';
        err.style.display = 'block';
      }
    } catch (error) {
      err.textContent = 'Cannot connect to server. Is the backend running?';
      err.style.display = 'block';
    }
  });
</script>
</body>
</html>
