<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — CampusFind</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #f8fafc; }
    
    /* Admin Specific Styles */
    .admin-header {
      background: #ffffff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }
    .admin-badge {
      background: #fee2e2;
      color: #dc2626;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 15px;
    }
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    /* Overview Cards */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .stat-icon {
      width: 45px;
      height: 45px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .icon-blue { background: #dbeafe; color: #2563eb; }
    .icon-green { background: #dcfce7; color: #16a34a; }
    .icon-yellow { background: #fef3c7; color: #d97706; }
    .icon-red { background: #fee2e2; color: #dc2626; }
    
    .stat-info h3 { margin: 0; font-size: 1.5rem; color: #0f172a; }
    .stat-info p { margin: 0; font-size: 0.85rem; color: #64748b; font-weight: 600; }

    /* Data Tables */
    .table-container {
      background: white;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow-x: auto;
      margin-bottom: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .table-header {
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #0f172a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: #f8fafc;
      padding: 12px 20px;
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      border-bottom: 1px solid #e2e8f0;
    }
    td {
      padding: 15px 20px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
      color: #334155;
      vertical-align: middle;
    }
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-open { background: #dcfce7; color: #166534; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-claimed { background: #dbeafe; color: #1e40af; }
    
    .type-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .type-lost { background: #fee2e2; color: #991b1b; }
    .type-found { background: #dcfce7; color: #166534; }

    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-delete:hover { background: #fca5a5; }
  </style>
</head>
<body>

<!-- Admin Header -->
<header class="admin-header">
  <div style="display: flex; align-items: center;">
    <a href="index.html" class="logo" style="text-decoration: none; font-size: 1.2rem; font-weight: 800; color: #0f172a; display: flex; align-items: center;">
      <span class="logo-icon" style="background: #2563eb; color: white; padding: 6px 12px; border-radius: 8px; font-weight: bold; margin-right: 10px;">Q</span>
      CampusFind
    </a>
    <div class="admin-badge">
      <i class="fa-solid fa-shield-halved"></i> ADMIN CONTROL
    </div>
  </div>
  <div style="display: flex; gap: 15px;">
    <a href="index.html" class="btn btn-outline" style="padding: 8px 16px; border-radius: 6px; text-decoration: none; color: #475569; border: 1px solid #cbd5e1; font-weight: 600; font-size: 0.9rem;">
      <i class="fa-solid fa-house"></i> Main Site
    </a>
    <a href="#" id="logoutBtn" class="btn btn-danger" style="background:#dc2626; color:white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem;">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
    </a>
  </div>
</header>

<!-- Main Content -->
<div class="admin-container">
  
  <h2 style="color: #0f172a; margin-bottom: 25px; font-size: 1.8rem; text-align: center;">System Overview</h2>

  <!-- Stats Cards -->
  <div class="overview-grid">
    <div class="stat-card">
      <div class="stat-icon icon-blue"><i class="fa-solid fa-clipboard-list"></i></div>
      <div class="stat-info">
        <h3 id="totalReports">0</h3>
        <p>Total Reports</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon icon-green"><i class="fa-solid fa-circle-check"></i></div>
      <div class="stat-info">
        <h3 id="claimedItems">0</h3>
        <p>Claimed Items</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon icon-yellow"><i class="fa-solid fa-clock"></i></div>
      <div class="stat-info">
        <h3 id="pendingClaims">0</h3>
        <p>Pending Claims</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon icon-red"><i class="fa-solid fa-users"></i></div>
      <div class="stat-info">
        <h3 id="registeredUsers">0</h3>
        <p>Registered Users</p>
      </div>
    </div>
  </div>

  <!-- Manage All Items Table -->
  <div class="table-container">
    <div class="table-header">
      <i class="fa-solid fa-list-check"></i> Manage All Items
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Type</th>
          <th>Title</th>
          <th>Category</th>
          <th>Reported By</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="itemsTableBody">
        <tr>
          <td colspan="7" style="text-align: center; color: #64748b;">Loading items...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Registered Users Table -->
  <div class="table-container">
    <div class="table-header">
      <i class="fa-solid fa-user-group"></i> Registered Users
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Student ID</th>
          <th>Role</th>
          <th>Joined Date</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="4" style="text-align: center; color: #64748b;">Loading users...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  // 1. Security Check: Ensure user is logged in
  const token = localStorage.getItem('token');
  const userName = localStorage.getItem('userName');
  
  if (!token) {
    window.location.href = 'login.html';
  }

  document.getElementById('logoutBtn').addEventListener('click', function(e) {
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('studentId');
    localStorage.removeItem('userName');
    window.location.href = 'index.html';
  });

  // 2. Fetch Admin Data from Backend
  async function loadAdminData() {
    try {
      // Fetch Items
      const itemsRes = await fetch('http://localhost:5000/api/admin/items');
      const items = await itemsRes.json();
      
      // Fetch Users
      const usersRes = await fetch('http://localhost:5000/api/admin/users');
      const users = await usersRes.json();

      // Update Stat Cards
      document.getElementById('totalReports').innerText = items.length;
      document.getElementById('claimedItems').innerText = items.filter(i => i.status === 'claimed').length;
      document.getElementById('pendingClaims').innerText = items.filter(i => i.status === 'pending').length;
      document.getElementById('registeredUsers').innerText = users.length;

      // Populate Items Table
      const itemsTable = document.getElementById('itemsTableBody');
      if (items.length === 0) {
        itemsTable.innerHTML = '<tr><td colspan="7" style="text-align: center;">No items found.</td></tr>';
      } else {
        itemsTable.innerHTML = items.map(item => `
          <tr>
            <td style="color: #64748b; font-size: 0.8rem;">${item._id.substring(0, 6)}...</td>
            <td><span class="type-badge ${item.type === 'lost' ? 'type-lost' : 'type-found'}">${item.type.toUpperCase()}</span></td>
            <td style="font-weight: 600;">${item.title}</td>
            <td>${item.category}</td>
            <td>${item.reportedBy}</td>
            <td><span class="status-badge status-${item.status}">${item.status.toUpperCase()}</span></td>
            <td>
              <button class="btn-delete" onclick="deleteItem('${item._id}')">
                <i class="fa-solid fa-trash"></i> Delete
              </button>
            </td>
          </tr>
        `).join('');
      }

      // Populate Users Table
      const usersTable = document.getElementById('usersTableBody');
      if (users.length === 0) {
        usersTable.innerHTML = '<tr><td colspan="4" style="text-align: center;">No users found.</td></tr>';
      } else {
        usersTable.innerHTML = users.map(user => `
          <tr>
            <td style="font-weight: 600;">${user.name}</td>
            <td>${user.studentId}</td>
            <td><span class="status-badge ${user.role === 'admin' ? 'status-pending' : 'status-open'}">${user.role.toUpperCase()}</span></td>
            <td>${new Date(user.createdAt).toLocaleDateString()}</td>
          </tr>
        `).join('');
      }

    } catch (err) {
      console.error("Admin Data Error:", err);
      alert("Failed to load admin data. Make sure the backend server is running.");
    }
  }

  // 3. Delete Item Function
  async function deleteItem(id) {
    if (!confirm("Are you sure you want to permanently delete this item?")) return;

    try {
      const res = await fetch(`http://localhost:5000/api/admin/items/${id}`, {
        method: 'DELETE'
      });
      if (res.ok) {
        // Reload the data after successful deletion
        loadAdminData();
      } else {
        alert("Failed to delete item.");
      }
    } catch (err) {
      alert("Server error while deleting item.");
    }
  }

  // Load data on page start
  loadAdminData();
</script>

</body>
</html>
