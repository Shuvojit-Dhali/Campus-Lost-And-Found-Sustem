<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard — CampusFind</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    header { background: #fff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
    .nav { max-width: 1100px; margin: 0 auto; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { font-weight: 800; color: #2563eb; text-decoration: none; font-size: 1.2rem; }
    .nav-links a { margin-left: 18px; color: #64748b; text-decoration: none; font-weight: 500; }
    .nav-links a:hover { color: #2563eb; }
    .logout { background: #fff; border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    main { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .sub { color: #64748b; margin: 0 0 24px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .stat { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
    .stat .num { font-size: 1.7rem; font-weight: 800; }
    .stat .label { color: #64748b; font-size: 0.85rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab { border: 1px solid #cbd5e1; background: #fff; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; color: #334155; }
    .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-right: 6px; }
    .b-lost { background: #fee2e2; color: #dc2626; }
    .b-found { background: #dcfce7; color: #16a34a; }
    .b-open { background: #e0f2fe; color: #0369a1; }
    .b-claimed { background: #fef3c7; color: #b45309; }
    .b-resolved { background: #f1f5f9; color: #475569; }
    .card h3 { margin: 10px 0 8px; font-size: 1.1rem; }
    .meta { color: #64748b; font-size: 0.9rem; margin: 3px 0; }
    .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    button.small { border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-resolve { background: #16a34a; color: #fff; }
    .btn-delete { background: #fee2e2; color: #dc2626; }
    .msg { text-align: center; color: #64748b; padding: 30px; }
    @media (max-width: 560px) {
      .nav-links a { margin-left: 10px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav">
      <a class="logo" href="index.html">🔍 CampusFind</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="items.html">All Items</a>
        <a href="report.html">Report Item</a>
      </nav>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main>
    <h1>Welcome, <span id="whoami"></span></h1>
    <p class="sub">Here are the items you have reported.</p>

    <section class="stats">
      <div class="stat"><div class="num" id="sTotal">0</div><div class="label">My posts</div></div>
      <div class="stat"><div class="num" id="sLost">0</div><div class="label">Lost</div></div>
      <div class="stat"><div class="num" id="sFound">0</div><div class="label">Found</div></div>
      <div class="stat"><div class="num" id="sOpen">0</div><div class="label">Still open</div></div>
      <div class="stat"><div class="num" id="sResolved">0</div><div class="label">Resolved</div></div>
    </section>

    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="open">Open</button>
      <button class="tab" data-filter="resolved">Resolved</button>
    </div>

    <div id="status" class="msg">Loading your items...</div>
    <div id="list" class="grid"></div>
  </main>

  <script>
    const API = 'http://127.0.0.1:5000/api/items';
    const token = localStorage.getItem('token');
    const studentId = localStorage.getItem('studentId');
    let allItems = [];
    let currentFilter = 'all';

    if (!token || !studentId) {
      alert('Please log in first.');
      window.location.href = 'login.html';
    }

    // Escape text so user-entered titles can't break the page
    function esc(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function updateStats() {
      document.getElementById('sTotal').textContent = allItems.length;
      document.getElementById('sLost').textContent = allItems.filter(i => i.type === 'lost').length;
      document.getElementById('sFound').textContent = allItems.filter(i => i.type === 'found').length;
      document.getElementById('sOpen').textContent = allItems.filter(i => i.status === 'open').length;
      document.getElementById('sResolved').textContent = allItems.filter(i => i.status === 'resolved').length;
    }

    function render() {
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      const items = currentFilter === 'all'
        ? allItems
        : allItems.filter(i => i.status === currentFilter);

      list.innerHTML = '';

      if (items.length === 0) {
        status.style.display = 'block';
        status.textContent = allItems.length === 0
          ? "You haven't reported any items yet."
          : 'No items match this filter.';
        return;
      }

      status.style.display = 'none';

      items.forEach(item => {
        const date = new Date(item.date).toLocaleDateString();
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `${item.hasPhoto ? '<img src="http://127.0.0.1:5000/api/items/' + item._id + '/photo" alt="Item photo" style="width:100%;height:170px;object-fit:cover;border-radius:10px;margin-bottom:12px;">' : ''}
          ${item.hasPhoto ? '<img src="http://127.0.0.1:5000/api/items/' + item._id + '/photo" alt="Item photo" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:12px;">' : ''}
          <span class="badge ${item.type === 'lost' ? 'b-lost' : 'b-found'}">${esc(item.type.toUpperCase())}</span>
          <span class="badge b-${esc(item.status)}">${esc(item.status)}</span>
          <h3>${esc(item.title)}</h3>
          <p class="meta"><strong>Category:</strong> ${esc(item.category)}</p>
          <p class="meta"><strong>Location:</strong> ${esc(item.location)}</p>
          <p class="meta"><strong>Date:</strong> ${esc(date)}</p>
          <p class="meta"><strong>Color:</strong> ${esc(item.color || 'N/A')}</p>
          <div class="actions">
            ${item.status !== 'resolved'
              ? `<button class="small btn-resolve" data-id="${esc(item._id)}" data-action="resolve">Mark resolved</button>`
              : ''}
            <button class="small btn-delete" data-id="${esc(item._id)}" data-action="delete">Delete</button>
          </div>`;
        list.appendChild(card);
      });
    }

    async function loadItems() {
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.textContent = 'Loading your items...';
      try {
        const res = await fetch(`${API}?reportedBy=${encodeURIComponent(studentId)}`);
        if (!res.ok) throw new Error('Server responded with an error');
        allItems = await res.json();
        updateStats();
        render();
      } catch (err) {
        status.textContent = 'Could not load items. Is the backend running? (' + err.message + ')';
      }
    }

    // Filter tabs
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // Mark resolved / Delete
    document.getElementById('list').addEventListener('click', async e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = btn.dataset.id;

      try {
        if (btn.dataset.action === 'resolve') {
          const res = await fetch(`${API}/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reportedBy: studentId, status: 'resolved' })
          });
          if (!res.ok) throw new Error((await res.json()).message);
        }

        if (btn.dataset.action === 'delete') {
          if (!confirm('Delete this post? This cannot be undone.')) return;
          const res = await fetch(`${API}/${id}?reportedBy=${encodeURIComponent(studentId)}`, {
            method: 'DELETE'
          });
          if (!res.ok) throw new Error((await res.json()).message);
        }

        await loadItems();
      } catch (err) {
        alert('Something went wrong: ' + err.message);
      }
    });

    document.getElementById('whoami').textContent = studentId || '';

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('studentId');
      window.location.href = 'index.html';
    });

    if (token && studentId) loadItems();
  </script>
</body>
</html>
