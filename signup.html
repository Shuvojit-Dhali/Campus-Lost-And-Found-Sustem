<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="signup-page">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <a href="index.html" class="home-link">← CampusFind</a>
    <a href="login.html" class="login-btn">Login</a>

    <div class="signup-form-wrapper">
      <div class="form-card">
        <div class="form-title">Create Account</div>
        <div class="form-subtitle">Register with your Student ID ✨</div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <form id="signupForm">
          <label class="form-label" for="signup-id">Student ID</label>
          <input
            class="form-input"
            id="signup-id"
            type="text"
            placeholder="e.g. 2024001"
            autocomplete="username"
            required
          />

          <label class="form-label" for="signup-password">Password</label>
          <div class="password-wrapper">
            <input
              class="form-input"
              id="signup-password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            />
            <span class="eye-icon" onclick="togglePassword('signup-password', this)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 6C8.5 6 5.5 7.8 3.5 10.5C3.1 11.1 3.1 11.9 3.5 12.5C5.5 15.2 8.5 17 12 17C15.5 17 18.5 15.2 20.5 12.5C20.9 11.9 20.9 11.1 20.5 10.5C18.5 7.8 15.5 6 12 6Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
                <path class="eye-slash" d="M4 4L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
          </div>

          <label class="form-label" for="signup-confirm" style="margin-top:18px;">Confirm Password</label>
          <div class="password-wrapper">
            <input
              class="form-input"
              id="signup-confirm"
              type="password"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            />
            <span class="eye-icon" onclick="togglePassword('signup-confirm', this)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 6C8.5 6 5.5 7.8 3.5 10.5C3.1 11.1 3.1 11.9 3.5 12.5C5.5 15.2 8.5 17 12 17C15.5 17 18.5 15.2 20.5 12.5C20.9 11.9 20.9 11.1 20.5 10.5C18.5 7.8 15.5 6 12 6Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
                <path class="eye-slash" d="M4 4L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
          </div>

          <label class="terms-row">
            <input type="checkbox" id="terms" />
            <span class="checkbox-square"></span>
            <span class="terms-text">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </span>
          </label>

          <button type="submit" class="signup-submit">Create Account</button>
        </form>

        <div class="login-prompt">
          Already have an account?
          <a href="login.html">Login</a>
        </div>
      </div>
    </div>
  </div>

 <script>
  function togglePassword(id, icon) {
    const input = document.getElementById(id);
    const slash = icon.querySelector('.eye-slash');
    if (input.type === 'password') {
      input.type = 'text';
      slash.style.display = 'none';
    } else {
      input.type = 'password';
      slash.style.display = 'block';
    }
  }

  document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const id = document.getElementById('signup-id').value.trim();
    const pass = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    const terms = document.getElementById('terms').checked;

    const err = document.getElementById('errorMsg');
    const success = document.getElementById('successMsg');
    err.style.display = 'none';
    success.style.display = 'none';

    function showError(msg) {
      err.textContent = msg;
      err.style.display = 'block';
    }

    if (!id) return showError('Student ID is required.');
    if (id.length < 4) return showError('Student ID must be at least 4 characters.');
    if (pass.length < 6) return showError('Password must be at least 6 characters.');
    if (pass !== confirm) return showError('Passwords do not match.');
    if (!terms) return showError('Please accept the Terms of Service.');

    // --- NEW CODE: Talk to the Backend! ---
    try {
      const response = await fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ studentId: id, password: pass })
      });

      const data = await response.json();

      if (response.ok) {
        success.textContent = 'Account created successfully! Redirecting to login...';
        success.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } else {
        showError(data.message || 'Registration failed.');
      }
    } catch (error) {
      showError('Cannot connect to server. Is the backend running?');
    }
  });
</script>
</body>
</html>
