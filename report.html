<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Item — CampusFind</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 14px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid var(--border); }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; transition: 0.2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .radio-group { display: flex; gap: 20px; }
    .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
    .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1.1rem; transition: 0.2s; margin-top: 10px; }
    .submit-btn:hover { background: var(--primary-dark); }
    .message { display: none; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: center; font-weight: 600; }
  </style>
</head>
<body style="background: #f8fafc;">

  <header>
    <div class="container navbar">
      <a href="index.html" class="logo"><span class="logo-icon">🔍</span> CampusFind</a>
      <a href="index.html" class="btn btn-outline">← Back to Home</a>
    </div>
  </header>

  <div class="form-container">
    <h2 style="margin-bottom: 5px; color: var(--text);">Report an Item</h2>
    <p style="color: var(--muted); margin-bottom: 25px; font-size: 0.95rem;">Fill out the details below to report a lost or found item.</p>
    
    <div id="message" class="message"></div>

    <form id="reportForm">
      
      <div class="form-group radio-group">
        <label><input type="radio" name="type" value="lost" required checked> I Lost an Item</label>
        <label><input type="radio" name="type" value="found" required> I Found an Item</label>
      </div>

      <div class="form-group">
        <label>Item Title (e.g., Black Leather Wallet)</label>
        <input type="text" id="title" placeholder="Enter item name" required>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="category" required>
          <option value="">Select Category</option>
          <option>Wallet</option>
          <option>ID Card</option>
          <option>Phone</option>
          <option>Bag</option>
          <option>Keys</option>
          <option>Books</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Color</label>
        <input type="text" id="color" placeholder="e.g., Black, Blue, Red">
      </div>

      <div class="form-group">
        <label>Campus Location</label>
        <select id="location" required>
          <option value="">Select Location</option>
          <option>Library</option>
          <option>Cafeteria</option>
          <option>Academic Building</option>
          <option>Bus Stand</option>
          <option>Playground</option>
          <option>Hostel</option>
        </select>
      </div>

      <div class="form-group">
        <label>Date (When was it lost/found?)</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label>Description (Any unique details to prove ownership)</label>
        <textarea id="description" rows="3" placeholder="e.g., Has a scratch on the back, contains a specific ID card, etc."></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Report</button>
    </form>
  </div>

  <script>
    // 1. Check if user is logged in
    const token = localStorage.getItem('token');
    const studentId = localStorage.getItem('studentId');

    if (!token || !studentId) {
      alert('Please login first to report an item.');
      window.location.href = 'login.html';
    }

    // 2. Handle Form Submission
    document.getElementById('reportForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const msgBox = document.getElementById('message');
      msgBox.style.display = 'none';

      // Get form data
      const itemData = {
        type: document.querySelector('input[name="type"]:checked').value,
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        color: document.getElementById('color').value,
        location: document.getElementById('location').value,
        date: document.getElementById('date').value,
        description: document.getElementById('description').value,
        reportedBy: studentId
      };

      try {
        // Send to backend
        const response = await fetch('http://localhost:5000/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(itemData)
        });

        const data = await response.json();

        if (response.ok) {
          msgBox.style.background = '#dcfce7';
          msgBox.style.color = '#166534';
          msgBox.textContent = 'Item reported successfully! Redirecting to view items...';
          msgBox.style.display = 'block';
          
          setTimeout(() => {
            window.location.href = 'items.html';
          }, 1500);
        } else {
          msgBox.style.background = '#fee2e2';
          msgBox.style.color = '#991b1b';
          msgBox.textContent = data.message || 'Failed to report item.';
          msgBox.style.display = 'block';
        }
      } catch (error) {
        msgBox.style.background = '#fee2e2';
        msgBox.style.color = '#991b1b';
        msgBox.textContent = 'Cannot connect to server. Is the backend running?';
        msgBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
