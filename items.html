<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Items — CampusFind</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-header { text-align: center; padding: 40px 20px 20px; }
    .page-header h1 { font-size: 2.5rem; color: #0f172a; margin-bottom: 10px; }
    .page-header p { color: #64748b; }
    
    .items-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    
    .items-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 20px; 
      margin-top: 30px;
    }

    .item-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }

    .item-card:hover { transform: translateY(-3px); }
    
    .item-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
    .badge-lost { background: #fee2e2; color: #dc2626; }
    .badge-found { background: #dcfce7; color: #16a34a; }

    .item-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; color: #0f172a; }
    .item-detail { color: #64748b; font-size: 0.9rem; margin-bottom: 5px; }
    .item-detail strong { color: #334155; }
    
    .error-msg { text-align: center; color: #dc2626; margin-top: 40px; font-size: 1.1rem; }
    .loading-msg { text-align: center; color: #64748b; margin-top: 40px; }
  </style>
</head>
<body style="background: #f8fafc;">

  <!-- Header -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo"><span class="logo-icon">🔍</span> CampusFind</a>
      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
        <a href="report.html" class="btn btn-primary">+ Report New Item</a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <h1>All Reported Items</h1>
    <p>Browse through items reported by students across the campus.</p>
  </div>

  <div class="items-container">
    <div id="loading" class="loading-msg">Loading items from the server...</div>
    <div id="errorBox" class="error-msg" style="display: none;"></div>
    
    <div class="items-grid" id="itemsGrid">
      <!-- Items will be injected here by JavaScript -->
    </div>
  </div>

  <script>
    // We use 127.0.0.1 instead of localhost to avoid CORS issues in some browsers
    const API_URL = 'http://127.0.0.1:5000/api/items';

    async function loadItems() {
      const loading = document.getElementById('loading');
      const errorBox = document.getElementById('errorBox');
      const grid = document.getElementById('itemsGrid');

      try {
        const response = await fetch(API_URL);
        
        if (!response.ok) {
          throw new Error('Server responded with an error');
        }

        const items = await response.json();
        
        loading.style.display = 'none';

        if (items.length === 0) {
          grid.innerHTML = '<p style="text-align:center; width:100%; color:#64748b;">No items reported yet. Be the first!</p>';
          return;
        }

        // Loop through each item and create a card
        items.forEach(item => {
          const date = new Date(item.date).toLocaleDateString();
          
          const card = document.createElement('div');
          card.className = 'item-card';
          
          card.innerHTML = `
            <span class="item-badge ${item.type === 'lost' ? 'badge-lost' : 'badge-found'}">
              ${item.type.toUpperCase()}
            </span>
            <h3 class="item-title">${item.title}</h3>
            <p class="item-detail"><strong>Category:</strong> ${item.category}</p>
            <p class="item-detail"><strong>Location:</strong> ${item.location}</p>
            <p class="item-detail"><strong>Date:</strong> ${date}</p>
            <p class="item-detail"><strong>Color:</strong> ${item.color || 'N/A'}</p>
            <p class="item-detail" style="margin-top: 10px; font-style: italic;">"${item.description || 'No description provided'}"</p>
          `;
          
          grid.appendChild(card);
        });

      } catch (error) {
        loading.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.innerHTML = 'Error connecting to server. Make sure backend is running.<br><small>' + error.message + '</small>';
        console.error('Fetch error:', error);
      }
    }

    // Run the function when the page loads
    loadItems();
  </script>
</body>
</html>
