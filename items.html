<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Items — CampusFind</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-header { text-align: center; padding: 40px 20px 20px; }
    .page-header h1 { font-size: 2.5rem; color: #0f172a; margin-bottom: 10px; }
    .page-header p { color: #64748b; }
    
    .items-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
    
    .item-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .item-card:hover { transform: translateY(-3px); }
    
    .item-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
    .badge-lost { background: #fee2e2; color: #dc2626; }
    .badge-found { background: #dcfce7; color: #16a34a; }
    
    .item-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; color: #0f172a; }
    .item-detail { color: #64748b; font-size: 0.9rem; margin-bottom: 5px; }
    .item-detail strong { color: #334155; }
    
    .action-btn { width: 100%; margin-top: 15px; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; display: block;}
    
    /* Different colors for different actions */
    .btn-claim { background: #2563eb; color: white; }
    .btn-claim:hover { background: #1d4ed8; }
    .btn-return { background: #16a34a; color: white; }
    .btn-return:hover { background: #15803d; }
    
    .hidden-notice { font-size: 0.8rem; color: #94a3b8; font-style: italic; margin-top: 10px; text-align: center; padding-top: 10px; border-top: 1px dashed #e2e8f0;}
    
    .filter-banner { background: #e0f2fe; color: #0369a1; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; display: none; }
  </style>
</head>
<body style="background: #f8fafc;">

  <header>
    <div class="container navbar">
      <a href="index.html" class="logo"><span class="logo-icon">🔍</span> CampusFind</a>
      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
        <a href="report.html" class="btn btn-primary">+ Report New Item</a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <h1>All Reported Items</h1>
    <p>Browse items reported by students across the campus.</p>
  </div>

  <div class="items-container">
    <div id="filterBanner" class="filter-banner"></div>
    
    <div class="items-grid" id="itemsGrid">
      <p style="text-align: center; width: 100%; color: #64748b;">Loading items...</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const studentId = localStorage.getItem('studentId');

    // Get URL search parameters
    const urlParams = new URLSearchParams(window.location.search);
    const filterCategory = urlParams.get('category');
    const filterLocation = urlParams.get('location');
    const filterDate = urlParams.get('date');

    // Show filter banner
    if (filterCategory || filterLocation || filterDate) {
      const banner = document.getElementById('filterBanner');
      banner.style.display = 'block';
      let activeFilters = [];
      if (filterCategory) activeFilters.push(`Category: ${filterCategory}`);
      if (filterLocation) activeFilters.push(`Location: ${filterLocation}`);
      if (filterDate) activeFilters.push(`Date: ${filterDate}`);
      banner.innerHTML = `Showing results for: <strong>${activeFilters.join(' | ')}</strong> <a href="items.html" style="margin-left:15px; color:#dc2626; font-size:0.9rem;">Clear Search</a>`;
    }

    async function loadItems() {
      const grid = document.getElementById('itemsGrid');
      
      try {
        const response = await fetch('http://localhost:5000/api/items');
        let items = await response.json();
        
        // Apply Filters
        if (filterCategory) items = items.filter(item => item.category.toLowerCase() === filterCategory.toLowerCase());
        if (filterLocation) items = items.filter(item => item.building.toLowerCase() === filterLocation.toLowerCase());
        if (filterDate) {
          items = items.filter(item => new Date(item.date).toISOString().split('T')[0] === filterDate);
        }

        if (items.length === 0) {
          grid.innerHTML = '<p style="text-align:center; width:100%; color:#64748b; font-size:1.1rem;">No items found matching your search.</p>';
          return;
        }

        grid.innerHTML = ''; 

        items.forEach(item => {
          const date = new Date(item.date).toLocaleDateString();
          const card = document.createElement('div');
          card.className = 'item-card';
          
          let actionButton = '';

          // CHECK: Is this my own item?
          if (item.reportedBy === studentId) {
            actionButton = `<div style="text-align:center; color:#64748b; font-size:0.9rem; margin-top:15px; font-weight:600;">Your Own Report</div>`;
          } 
          // IF NOT LOGGED IN
          else if (!token) {
             actionButton = `<a href="login.html" class="action-btn btn-claim">Login to Interact</a>`;
          } 
          // IF IT'S A FOUND ITEM (The person looking might be the owner)
          else if (item.type === 'found') {
            actionButton = `<button class="action-btn btn-claim" onclick="interactItem('${item._id}', 'claim')">This is Mine (Claim)</button>`;
          } 
          // IF IT'S A LOST ITEM (The person looking might be the finder)
          else if (item.type === 'lost') {
            actionButton = `<button class="action-btn btn-return" onclick="interactItem('${item._id}', 'return')">I Found This (Return)</button>`;
          }

          card.innerHTML = `
            <div>
              <span class="item-badge ${item.type === 'lost' ? 'badge-lost' : 'badge-found'}">
                ${item.type.toUpperCase()}
              </span>
              <h3 class="item-title">${item.title}</h3>
              <p class="item-detail"><strong>Category:</strong> ${item.category}</p>
              <p class="item-detail"><strong>Color:</strong> ${item.color}</p>
              <p class="item-detail"><strong>Location:</strong> ${item.building}, Floor ${item.floor}, Room ${item.room}</p>
              <p class="item-detail"><strong>Date:</strong> ${date}</p>
            </div>
            
            <div>
              <div class="hidden-notice">📷 Photo & Description hidden for privacy</div>
              ${actionButton}
            </div>
          `;
          grid.appendChild(card);
        });
        
      } catch (error) {
        grid.innerHTML = '<p style="color:red;text-align:center; width:100%;">Failed to load items. Is the server running?</p>';
      }
    }

    async function interactItem(itemId, actionType) {
      if (!token) return window.location.href = 'login.html';
      
      const message = actionType === 'claim' 
        ? 'Are you sure this is your item? The Admin will be notified to verify your claim.' 
        : 'Are you sure you found this item? The owner will be notified.';

      if (!confirm(message)) return;

      try {
        // For both claim and return, we update the status to 'claimed' 
        // and set the claimedBy to the person interacting with it.
        const response = await fetch(`http://localhost:5000/api/items/${itemId}/claim`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claimedBy: studentId })
        });
        
        const data = await response.json();
        if (response.ok) {
          alert('Action successful! Go to your dashboard to view the private photo and details.');
          window.location.href = 'dashboard.html';
        } else {
          alert(data.message);
        }
      } catch (error) {
        alert('Failed to process request.');
      }
    }

    loadItems();
  </script>
</body>
</html>
